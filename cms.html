<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyCMS</title>
<style>
:root{
  --wp-blue:#2271b1;
  --wp-blue-dark:#135e96;
  --wp-dark:#1d2327;
  --wp-darker:#101417;
  --wp-gray-0:#f6f7f7;
  --wp-gray-5:#f0f0f1;
  --wp-gray-10:#e5e5e5;
  --wp-gray-20:#c3c4c7;
  --wp-gray-50:#8c8f94;
  --wp-gray-80:#2c3338;
  --radius:8px;
  --shadow:0 1px 2px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen-Sans,Ubuntu,Cantarell,"Helvetica Neue",sans-serif;color:#1e1e1e;background:#fff;-webkit-font-smoothing:antialiased}
a{color:var(--wp-blue);text-decoration:none}
a:hover{color:var(--wp-blue-dark)}
img{max-width:100%;height:auto}

/* Public */
.site-header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--wp-gray-10)}
.container{max-width:1200px;margin:0 auto;padding:0 24px}
.header-inner{display:flex;align-items:center;gap:28px;height:68px}
.logo{font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--wp-dark);display:flex;align-items:center;gap:8px}
.logo-dot{width:10px;height:10px;border-radius:50%;background:var(--wp-blue);display:inline-block}
.nav{display:flex;gap:24px}
.nav a{color:#50575e;font-weight:500;font-size:15px;padding:8px 0;position:relative}
.nav a.active,.nav a:hover{color:var(--wp-dark)}
.nav a.active::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--wp-dark);border-radius:2px}
.search-box{margin-left:auto;position:relative}
.search-box input{width:220px;padding:9px 36px 9px 14px;border:1px solid var(--wp-gray-20);border-radius:24px;background:#fff;font-size:14px;transition:all .2s}
.search-box input:focus{outline:none;border-color:var(--wp-blue);box-shadow:0 0 0 1px var(--wp-blue);width:260px}
.search-box button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;padding:4px;cursor:pointer;color:var(--wp-gray-50)}
.mobile-toggle{display:none;background:none;border:none;font-size:24px;cursor:pointer;color:var(--wp-dark)}

.main{padding:48px 0 80px;min-height:70vh}
.page-head{max-width:760px;margin:0 auto 40px;text-align:center}
.page-title{font-size:48px;line-height:1.1;margin:0 0 12px;letter-spacing:-1px}
.page-desc{font-size:18px;color:#50575e;margin:0}

.post-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:28px}
.post-card{background:#fff;border:1px solid var(--wp-gray-10);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:all .25s ease;cursor:pointer}
.post-card:hover{transform:translateY(-4px);box-shadow:0 12px 24px -10px rgba(0,0,0,.15);border-color:var(--wp-gray-20)}
.post-card-img-wrap{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--wp-gray-5)}
.post-card-img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.post-card:hover .post-card-img{transform:scale(1.04)}
.post-card-body{padding:22px;flex:1;display:flex;flex-direction:column}
.post-card-cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--wp-blue)}
.post-card-title{font-size:21px;margin:8px 0 10px;line-height:1.3;color:var(--wp-dark);font-weight:700}
.post-card-excerpt{color:#50575e;font-size:15px;line-height:1.6;flex:1}
.post-card-meta{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--wp-gray-5);font-size:13px;color:var(--wp-gray-50)}

.article-wrap{max-width:800px;margin:0 auto}
.article-hero{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;margin-bottom:36px;background:var(--wp-gray-5)}
.article-cat{display:inline-block;padding:4px 10px;background:var(--wp-gray-5);border-radius:20px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--wp-blue);margin-bottom:16px}
.article-title{font-size:48px;line-height:1.1;margin:0 0 16px;letter-spacing:-1px;font-weight:800}
.article-meta{display:flex;gap:16px;align-items:center;color:var(--wp-gray-50);font-size:14px;margin-bottom:32px}
.article-content{font-size:18px;line-height:1.8;color:#2c3338}
.article-content p{margin:0 0 1.4em}
.article-content h2{font-size:30px;margin:2em 0 .6em;line-height:1.2;letter-spacing:-.5px}
.article-content h3{font-size:22px;margin:1.6em 0 .5em}
.article-content ul,.article-content ol{padding-left:1.4em;margin:0 0 1.4em}
.article-content li{margin:.4em 0}
.article-content blockquote{margin:2em 0;padding:1em 1.4em;border-left:4px solid var(--wp-blue);background:var(--wp-gray-5);border-radius:0 8px 8px 0;font-style:italic;color:#50575e}
.article-content img{border-radius:12px;margin:2em 0}
.article-content a{text-decoration:underline;text-underline-offset:3px}

.site-footer{border-top:1px solid var(--wp-gray-10);padding:40px 0;text-align:center;color:var(--wp-gray-50);font-size:14px}
.empty-state{text-align:center;padding:80px 20px;color:var(--wp-gray-50)}
.empty-state h3{font-size:22px;color:var(--wp-dark);margin:0 0 8px}

/* Login */
.login-body{background:var(--wp-gray-5);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-wrap{width:100%;max-width:380px}
.login-logo{text-align:center;font-size:32px;font-weight:800;margin:0 0 24px;color:var(--wp-dark);display:flex;align-items:center;justify-content:center;gap:10px}
.login-card{background:#fff;padding:28px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.13);border:1px solid var(--wp-gray-20)}
.login-field{margin-bottom:18px}
.login-label{display:block;font-size:14px;font-weight:500;margin-bottom:6px;color:#2c3338}
.login-input{width:100%;padding:10px 12px;border:1px solid var(--wp-gray-50);border-radius:4px;font-size:16px}
.login-input:focus{outline:none;border-color:var(--wp-blue);box-shadow:0 0 0 1px var(--wp-blue)}
.login-error{background:#fcf0f1;border-left:4px solid #d63638;padding:12px;margin-bottom:16px;font-size:14px;color:#d63638}
.login-hint{margin-top:20px;text-align:center;font-size:13px;color:var(--wp-gray-50)}
.btn-login{width:100%;padding:10px;background:var(--wp-blue);color:#fff;border:1px solid var(--wp-blue);border-radius:4px;font-size:15px;font-weight:500;cursor:pointer}
.btn-login:hover{background:var(--wp-blue-dark)}

/* Admin */
.wp-admin{display:flex;min-height:100vh;background:var(--wp-gray-5)}
.admin-sidebar{width:260px;background:var(--wp-dark);color:#f0f0f1;position:fixed;left:0;top:0;bottom:0;overflow-y:auto;z-index:200;display:flex;flex-direction:column}
.admin-logo{padding:18px 20px;font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;color:#fff;border-bottom:1px solid #2c3338}
.admin-menu{list-style:none;margin:0;padding:12px 0;flex:1}
.admin-menu li{margin:0}
.admin-menu a{display:flex;align-items:center;gap:12px;padding:10px 20px;color:#c3c4c7;text-decoration:none;font-size:14px;transition:all .15s;border-left:3px solid transparent}
.admin-menu a:hover{color:#fff;background:#2c3338}
.admin-menu a.active{background:#2271b1;color:#fff;border-left-color:#72aee6}
.admin-menu svg{width:18px;height:18px;opacity:.8}
.admin-menu .menu-sep{height:1px;background:#2c3338;margin:12px 20px}
.admin-main{flex:1;margin-left:260px;min-width:0;display:flex;flex-direction:column}
.admin-topbar{height:60px;background:#fff;border-bottom:1px solid var(--wp-gray-20);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:90}
.admin-burger{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--wp-dark);padding:4px}
.admin-title{font-size:20px;font-weight:500;color:var(--wp-dark);flex:1}
.admin-user{display:flex;align-items:center;gap:8px;font-size:13px;color:#50575e}
.admin-avatar{width:28px;height:28px;border-radius:50%;background:var(--wp-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.admin-content{padding:24px;flex:1}
.admin-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150}

.wp-notice{padding:12px 16px;background:#fff;border-left:4px solid #72aee6;box-shadow:0 1px 1px rgba(0,0,0,.04);margin-bottom:20px;border-radius:0 4px 4px 0}
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:28px}
.stat-card{background:#fff;border:1px solid var(--wp-gray-20);border-radius:6px;padding:20px;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.stat-label{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--wp-gray-50);font-weight:600;margin-bottom:8px}
.stat-value{font-size:32px;font-weight:600;line-height:1;color:var(--wp-dark)}
.stat-sub{font-size:13px;color:var(--wp-gray-50);margin-top:6px}

.wp-card{background:#fff;border:1px solid var(--wp-gray-20);border-radius:4px;box-shadow:0 1px 1px rgba(0,0,0,.04);margin-bottom:20px}
.wp-card-header{padding:14px 20px;border-bottom:1px solid var(--wp-gray-10);display:flex;align-items:center;justify-content:space-between}
.wp-card-title{font-size:14px;font-weight:600;margin:0}
.wp-card-body{padding:20px}

.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.filter-tabs{display:flex;gap:2px;background:var(--wp-gray-5);padding:3px;border-radius:6px}
.filter-tabs button{padding:6px 14px;border:none;background:transparent;border-radius:4px;font-size:13px;cursor:pointer;color:#50575e;font-weight:500}
.filter-tabs button.active{background:#fff;color:var(--wp-dark);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search-mini{margin-left:auto;position:relative}
.search-mini input{padding:7px 28px 7px 10px;border:1px solid var(--wp-gray-20);border-radius:4px;font-size:13px;width:200px}
.search-mini svg{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--wp-gray-50)}

.table-wrap{overflow-x:auto}
.wp-table{width:100%;border-collapse:collapse;font-size:14px}
.wp-table th{text-align:left;padding:10px 12px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--wp-gray-50);border-bottom:1px solid var(--wp-gray-20);background:var(--wp-gray-0);white-space:nowrap}
.wp-table td{padding:14px 12px;border-bottom:1px solid var(--wp-gray-5);vertical-align:top}
.wp-table tr:hover td{background:#f6f7f7}
.wp-table .row-title{font-weight:600;color:var(--wp-blue);cursor:pointer}
.wp-table .row-title:hover{color:var(--wp-blue-dark)}
.row-actions{display:flex;gap:12px;margin-top:6px;font-size:13px;visibility:hidden}
.wp-table tr:hover .row-actions{visibility:visible}
.row-actions a{color:var(--wp-blue)}
.row-actions a.delete{color:#b32d2e}
.status-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.status-published{background:#e7f5e9;color:#1f6b2c}
.status-draft{background:#f0f0f1;color:#50575e}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:3px;border:1px solid;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;line-height:1.4;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--wp-blue);border-color:var(--wp-blue);color:#fff}
.btn-primary:hover{background:var(--wp-blue-dark);border-color:var(--wp-blue-dark);color:#fff}
.btn-secondary{background:#fff;border-color:var(--wp-gray-20);color:var(--wp-dark)}
.btn-secondary:hover{border-color:var(--wp-gray-50);background:#f6f7f7}
.btn-danger{background:#d63638;border-color:#d63638;color:#fff}
.btn-danger:hover{background:#b32d2e}

.form-grid{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
.form-main,.form-side{display:flex;flex-direction:column;gap:20px}
.form-row{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:13px;font-weight:500;color:var(--wp-dark)}
.form-hint{font-size:12px;color:var(--wp-gray-50);margin-top:4px}
.form-input,.form-select,.form-textarea{width:100%;padding:8px 10px;border:1px solid var(--wp-gray-50);border-radius:4px;font-size:14px;font-family:inherit;background:#fff}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--wp-blue);box-shadow:0 0 0 1px var(--wp-blue)}
.form-textarea{min-height:80px;resize:vertical;line-height:1.5}
.title-input{font-size:22px!important;padding:10px 12px!important;font-weight:600}

.editor-wrap{border:1px solid var(--wp-gray-50);border-radius:4px;overflow:hidden;background:#fff}
.editor-toolbar{display:flex;flex-wrap:wrap;gap:2px;padding:6px;background:var(--wp-gray-0);border-bottom:1px solid var(--wp-gray-20)}
.editor-toolbar button{width:32px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:#2c3338;font-size:14px}
.editor-toolbar button:hover{background:#fff;border-color:var(--wp-gray-20)}
.editor-toolbar .sep{width:1px;height:20px;background:var(--wp-gray-20);margin:0 4px;align-self:center}
.editor-content{min-height:340px;padding:16px;outline:none;font-size:15px;line-height:1.7}
.editor-content:empty:before{content:attr(data-placeholder);color:#a7aaad;pointer-events:none}

.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.media-item{aspect-ratio:1;background:var(--wp-gray-5);border-radius:4px;overflow:hidden;border:1px solid var(--wp-gray-10)}
.media-item img{width:100%;height:100%;object-fit:cover}

/* Responsive */
@media (max-width:960px){
  .form-grid{grid-template-columns:1fr}
  .form-side{order:-1}
}
@media (max-width:782px){
  .admin-sidebar{transform:translateX(-100%);transition:transform .25s;width:280px}
  .admin-sidebar.open{transform:translateX(0);box-shadow:0 0 20px rgba(0,0,0,.3)}
  .admin-main{margin-left:0}
  .admin-burger{display:block}
  .admin-overlay.open{display:block}
  .header-inner{height:auto;padding:14px 0;flex-wrap:wrap;gap:14px}
  .nav{order:3;width:100%;justify-content:center;border-top:1px solid var(--wp-gray-10);padding-top:12px}
  .mobile-toggle{display:block;margin-left:auto}
  .search-box{display:none}
  .search-box.open{display:block;width:100%;order:4;margin:8px 0 0}
  .search-box.open input{width:100%}
  .post-grid{grid-template-columns:1fr}
  .page-title,.article-title{font-size:36px}
  .admin-content{padding:16px}
  .dashboard-grid{grid-template-columns:1fr 1fr}
  .toolbar{flex-direction:column;align-items:stretch}
  .search-mini{margin-left:0;width:100%}
  .search-mini input{width:100%}
  .row-actions{visibility:visible}
}
@media (max-width:480px){
  .container{padding:0 16px}
  .dashboard-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<script>
const DB = {
  POSTS:'mycms_posts',
  SETTINGS:'mycms_settings',
  SESSION:'mycms_session',
  getPosts(){try{return JSON.parse(localStorage.getItem(this.POSTS)||'[]')}catch{return[]}},
  savePosts(p){localStorage.setItem(this.POSTS,JSON.stringify(p))},
  getSettings(){
    let s=null;try{s=JSON.parse(localStorage.getItem(this.SETTINGS))}catch{}
    if(!s){s={siteTitle:'MyCMS',tagline:'Just another MyCMS site',username:'admin',passwordHash:btoa('admin123')};localStorage.setItem(this.SETTINGS,JSON.stringify(s))}
    return s
  },
  saveSettings(s){localStorage.setItem(this.SETTINGS,JSON.stringify(s))},
  getSession(){try{return JSON.parse(localStorage.getItem(this.SESSION))}catch{return null}},
  setSession(s){localStorage.setItem(this.SESSION,JSON.stringify(s))},
  clearSession(){localStorage.removeItem(this.SESSION)}
};

function initData(){
  if(!localStorage.getItem(DB.POSTS)){
    const now=Date.now();
    const posts=[
      {
        id:'1',
        title:'Hello World!',
        slug:'hello-world',
        content:`<p>Welcome to <strong>MyCMS</strong> — a lightweight, WordPress-inspired content management system built entirely in your browser.</p><p>This is your first post. Edit or delete it, then start publishing!</p><h2>Features</h2><ul><li>No database required — everything saves to localStorage</li><li>Clean writing experience with rich text</li><li>Instant preview and fast loading</li><li>Fully responsive admin dashboard</li></ul><p>Happy publishing!</p>`,
        excerpt:'Welcome to MyCMS — a lightweight, WordPress-inspired CMS built entirely in your browser.',
        featuredImage:'',
        category:'News',
        tags:['welcome','cms'],
        status:'published',
        date:new Date(now-86400000*5).toISOString(),
        author:'admin'
      },
      {
        id:'2',
        title:'Getting Started with MyCMS',
        slug:'getting-started',
        content:`<p>MyCMS makes it easy to create and manage content without any server setup.</p><h2>Writing Posts</h2><p>Head to <strong>Posts → Add New</strong> in the admin dashboard. Use the toolbar to format your content with headings, bold, lists, and images.</p><h2>Customizing</h2><p>Visit Settings to change your site title, tagline, and admin credentials. All changes are saved instantly in your browser.</p><blockquote>Pro tip: Your content stays private in localStorage until you export it.</blockquote>`,
        excerpt:'Learn how to create posts, use the editor, and customize your site in under 2 minutes.',
        featuredImage:'',
        category:'Tutorial',
        tags:['guide','tutorial'],
        status:'published',
        date:new Date(now-86400000*2).toISOString(),
        author:'admin'
      },
      {
        id:'3',
        title:'The Future of Browser-Based CMS',
        slug:'future-browser-cms',
        content:`<p>Modern browsers are powerful application platforms. With localStorage, IndexedDB, and service workers, you can build full-featured apps that work offline.</p><h2>Why Local-First?</h2><p>Privacy, speed, and portability. Your content stays on your device until you decide to export it.</p><h3>Benefits</h3><ul><li>No hosting costs for development</li><li>Instant load times</li><li>Works offline</li><li>Full control of your data</li></ul>`,
        excerpt:'Exploring why local-first, browser-based tools are becoming increasingly viable for creators.',
        featuredImage:'',
        category:'Opinion',
        tags:['future','webdev'],
        status:'published',
        date:new Date(now-86400000).toISOString(),
        author:'admin'
      },
      {
        id:'4',
        title:'Draft: Advanced Customization Ideas',
        slug:'draft-advanced-customization',
        content:`<p>This is a draft post. Ideas for future features: custom themes, markdown support, export to JSON, and PWA offline mode.</p>`,
        excerpt:'Work in progress',
        featuredImage:'',
        category:'Ideas',
        tags:['draft'],
        status:'draft',
        date:new Date().toISOString(),
        author:'admin'
      }
    ];
    DB.savePosts(posts);
  }
}

function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function slugify(s){return String(s||'').toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-')}
function formatDate(iso){try{return new Date(iso).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})}catch{return''}}
function isLoggedIn(){const s=DB.getSession();return s&&s.loggedIn}
function parseHash(){const hash=location.hash.slice(1)||'/';const [pathPart,qs]=hash.split('?');const parts=pathPart.split('/').filter(Boolean);return{path:pathPart,parts,query:new URLSearchParams(qs||'')}}

function router(){
  initData();
  const {parts}=parseHash();
  const hash=location.hash||'#/';
  if(hash.startsWith('#/login')){renderLogin();return}
  if(hash.startsWith('#/admin')){if(!isLoggedIn()){location.hash='#/login';return}renderAdmin(parts);return}
  renderPublic(parts);
}

function renderPublic(parts){
  const settings=DB.getSettings();
  document.title=settings.siteTitle+(settings.tagline?' — '+settings.tagline:'');
  document.body.className='public-body';
  const posts=DB.getPosts().filter(p=>p.status==='published').sort((a,b)=>new Date(b.date)-new Date(a.date));
  
  document.body.innerHTML=`
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <a href="#/" class="logo"><span class="logo-dot"></span>${escapeHtml(settings.siteTitle)}</a>
        <nav class="nav" id="mainNav">
          <a href="#/" data-nav="home">Home</a>
          <a href="#/about" data-nav="about">About</a>
          <a href="#/admin">Admin</a>
        </nav>
        <form class="search-box" id="siteSearchForm">
          <input type="search" placeholder="Search..." id="siteSearchInput" aria-label="Search">
          <button type="submit" aria-label="Search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35"/></svg>
          </button>
        </form>
        <button class="mobile-toggle" id="mobileToggle" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>
  <main class="main"><div class="container" id="publicContent"></div></main>
  <footer class="site-footer"><div class="container">© ${new Date().getFullYear()} ${escapeHtml(settings.siteTitle)}. Built with MyCMS.</div></footer>
  `;
  
  const content=document.getElementById('publicContent');
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.remove('active'));
  document.getElementById('siteSearchForm').addEventListener('submit',e=>{e.preventDefault();const q=document.getElementById('siteSearchInput').value.trim();if(q)location.hash='#/search?q='+encodeURIComponent(q)});
  document.getElementById('mobileToggle').addEventListener('click',()=>{document.getElementById('siteSearchForm').classList.toggle('open')});
  
  const page=parts[0]||'';
  if(!page){
    document.querySelector('[data-nav="home"]').classList.add('active');
    content.innerHTML=`<div class="page-head"><h1 class="page-title">${escapeHtml(settings.siteTitle)}</h1><p class="page-desc">${escapeHtml(settings.tagline)}</p></div>`;
    renderPostGrid(content,posts);
  }else if(page==='post'&&parts[1]){
    const post=posts.find(p=>p.slug===parts[1]);
    if(!post){content.innerHTML=`<div class="empty-state"><h3>Post not found</h3><p>The post you're looking for doesn't exist.</p><p><a href="#/" class="btn btn-primary">Back home</a></p></div>`;return}
    renderSinglePost(content,post);
  }else if(page==='about'){
    document.querySelector('[data-nav="about"]').classList.add('active');
    content.innerHTML=`<div class="article-wrap"><h1 class="article-title">About</h1><div class="article-content"><p><strong>${escapeHtml(settings.siteTitle)}</strong> is powered by MyCMS, a single-file WordPress-like CMS that runs entirely in your browser.</p><p>No servers, no databases, no setup. Everything is saved to localStorage, making it perfect for demos, prototyping, and learning.</p><h2>How it works</h2><p>Visit <a href="#/login">the admin area</a> (username: <code>admin</code>, password: <code>admin123</code>) to create and manage posts. All data persists across page reloads.</p></div></div>`;
  }else if(page==='category'&&parts[1]){
    const cat=decodeURIComponent(parts[1]);
    const filtered=posts.filter(p=>p.category.toLowerCase()===cat.toLowerCase());
    content.innerHTML=`<div class="page-head"><h1 class="page-title">Category: ${escapeHtml(cat)}</h1><p class="page-desc">${filtered.length} post${filtered.length!==1?'s':''}</p></div>`;
    renderPostGrid(content,filtered);
  }else if(page==='search'){
    const q=parseHash().query.get('q')||'';document.getElementById('siteSearchInput').value=q;
    const filtered=q?posts.filter(p=>(p.title+p.excerpt+p.content).toLowerCase().includes(q.toLowerCase())):[];
    content.innerHTML=`<div class="page-head"><h1 class="page-title">Search</h1><p class="page-desc">${q?`Results for "${escapeHtml(q)}" — ${filtered.length} found`:'Enter a search term'}</p></div>`;
    renderPostGrid(content,filtered);
  }else{
    content.innerHTML=`<div class="empty-state"><h3>Page not found</h3><p><a href="#/" class="btn btn-primary">Go home</a></p></div>`;
  }
}

function renderPostGrid(container,posts){
  const grid=document.createElement('div');grid.className='post-grid';
  if(!posts.length){grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><h3>No posts yet</h3><p>Check back soon.</p></div>`}
  else{
    posts.forEach(p=>{
      const card=document.createElement('article');card.className='post-card';card.onclick=()=>location.hash='#/post/'+p.slug;
      const bg=`linear-gradient(135deg, hsl(${[...p.title].reduce((a,c)=>a+c.charCodeAt(0),0)%360},70%,60%), hsl(${([...p.title].reduce((a,c)=>a+c.charCodeAt(0),0)+60)%360},70%,50%))`;
      card.innerHTML=`
        <div class="post-card-img-wrap">${p.featuredImage?`<img src="${escapeHtml(p.featuredImage)}" alt="" class="post-card-img" loading="lazy">`:`<div style="width:100%;height:100%;background:${bg}"></div>`}</div>
        <div class="post-card-body">
          <div class="post-card-cat" onclick="event.stopPropagation();location.hash='#/category/${encodeURIComponent(p.category.toLowerCase())}'">${escapeHtml(p.category||'Uncategorized')}</div>
          <h2 class="post-card-title">${escapeHtml(p.title)}</h2>
          <p class="post-card-excerpt">${escapeHtml(p.excerpt||'')}</p>
          <div class="post-card-meta"><span>${formatDate(p.date)}</span><span>•</span><span>${escapeHtml(p.author||'admin')}</span></div>
        </div>`;
      grid.appendChild(card);
    });
  }
  container.appendChild(grid);
}

function renderSinglePost(container,post){
  const bg=`linear-gradient(135deg, hsl(${[...post.title].reduce((a,c)=>a+c.charCodeAt(0),0)%360},70%,60%), hsl(${([...post.title].reduce((a,c)=>a+c.charCodeAt(0),0)+60)%360},70%,50%))`;
  container.innerHTML=`
    <article class="article-wrap">
      ${post.featuredImage?`<img src="${escapeHtml(post.featuredImage)}" alt="" class="article-hero">`:`<div class="article-hero" style="background:${bg}"></div>`}
      <a href="#/category/${encodeURIComponent(post.category.toLowerCase())}" class="article-cat">${escapeHtml(post.category)}</a>
      <h1 class="article-title">${escapeHtml(post.title)}</h1>
      <div class="article-meta"><span>${formatDate(post.date)}</span><span>•</span><span>By ${escapeHtml(post.author||'admin')}</span></div>
      <div class="article-content">${post.content}</div>
      <div style="margin-top:48px;padding-top:24px;border-top:1px solid var(--wp-gray-10)"><a href="#/" class="btn btn-secondary">← Back to all posts</a></div>
    </article>
  `;
}

function renderDashboard(container,posts){
  const published=posts.filter(p=>p.status==='published').length;
  const drafts=posts.filter(p=>p.status==='draft').length;
  const recent=[...posts].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);
  container.innerHTML=`
    <div class="wp-notice">Welcome to MyCMS! Everything is saved in your browser's localStorage.</div>
    <div class="dashboard-grid">
      <div class="stat-card"><div class="stat-label">Total Posts</div><div class="stat-value">${posts.length}</div><div class="stat-sub">All time</div></div>
      <div class="stat-card"><div class="stat-label">Published</div><div class="stat-value">${published}</div><div class="stat-sub">Live on site</div></div>
      <div class="stat-card"><div class="stat-label">Drafts</div><div class="stat-value">${drafts}</div><div class="stat-sub">In progress</div></div>
    </div>
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:start">
      <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">Recent Posts</h2><a href="#/admin/posts" class="btn btn-secondary">View all</a></div><div class="wp-card-body" style="padding:0"><div class="table-wrap"><table class="wp-table"><thead><tr><th>Title</th><th>Status</th><th>Date</th></tr></thead><tbody>${recent.map(p=>`<tr><td><a href="#/admin/posts/edit/${p.id}" class="row-title">${escapeHtml(p.title)}</a></td><td><span class="status-badge status-${p.status}">${p.status}</span></td><td>${formatDate(p.date)}</td></tr>`).join('')}</tbody></table></div></div></div>
      <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">Quick Actions</h2></div><div class="wp-card-body" style="display:flex;flex-direction:column;gap:10px"><a href="#/admin/posts/new" class="btn btn-primary">+ New Post</a><a href="#/admin/settings" class="btn btn-secondary">Site Settings</a><a href="#/" target="_blank" class="btn btn-secondary">View Site</a></div></div>
    </div>
    <style>@media(max-width:900px){[style*="grid-template-columns:2fr 1fr"]{grid-template-columns:1fr!important}}</style>
  `;
}

function renderPostsList(container,posts){
  let filter='all',search='';
  function draw(){
    let filtered=[...posts];
    if(filter!=='all')filtered=filtered.filter(p=>p.status===filter);
    if(search)filtered=filtered.filter(p=>p.title.toLowerCase().includes(search)||(p.excerpt||'').toLowerCase().includes(search));
    filtered.sort((a,b)=>new Date(b.date)-new Date(a.date));
    container.innerHTML=`
      <div class="wp-card">
        <div class="wp-card-header"><div class="toolbar" style="width:100%;margin:0">
          <div class="filter-tabs"><button data-f="all" class="${filter==='all'?'active':''}">All (${posts.length})</button><button data-f="published" class="${filter==='published'?'active':''}">Published (${posts.filter(p=>p.status==='published').length})</button><button data-f="draft" class="${filter==='draft'?'active':''}">Drafts (${posts.filter(p=>p.status==='draft').length})</button></div>
          <div class="search-mini"><input type="search" placeholder="Search posts..." id="postSearch" value="${escapeHtml(search)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>
          <a href="#/admin/posts/new" class="btn btn-primary" style="margin-left:auto">Add New</a>
        </div></div>
        <div class="wp-card-body" style="padding:0"><div class="table-wrap"><table class="wp-table"><thead><tr><th style="width:40%">Title</th><th>Category</th><th>Status</th><th>Date</th></tr></thead><tbody>${filtered.map(p=>`<tr><td><div class="row-title" onclick="location.hash='#/admin/posts/edit/${p.id}'">${escapeHtml(p.title)}</div><div class="row-actions"><a href="#/admin/posts/edit/${p.id}">Edit</a>${p.status==='published'?`<a href="#/post/${p.slug}" target="_blank">View</a>`:''}<a href="#" class="delete" data-id="${p.id}">Trash</a></div></td><td>${escapeHtml(p.category||'—')}</td><td><span class="status-badge status-${p.status}">${p.status}</span></td><td>${formatDate(p.date)}</td></tr>`).join('')||`<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--wp-gray-50)">No posts found</td></tr>`}</tbody></table></div></div>
      </div>`;
    container.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.f;draw()}));
    document.getElementById('postSearch').addEventListener('input',e=>{search=e.target.value.toLowerCase();draw()});
    container.querySelectorAll('.delete').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const id=a.dataset.id;if(confirm('Move this post to trash?')){const idx=posts.findIndex(p=>p.id===id);if(idx>-1){posts.splice(idx,1);DB.savePosts(posts);draw()}}}));
  }
  draw();
}

function renderPostEditor(container,id=null){
  const posts=DB.getPosts();const isEdit=!!id;const post=isEdit?posts.find(p=>p.id===id):null;
  if(isEdit&&!post){container.innerHTML='<p>Post not found</p>';return}
  const data=post||{id:Date.now().toString(),title:'',slug:'',content:'',excerpt:'',featuredImage:'',category:'Uncategorized',tags:[],status:'draft',date:new Date().toISOString(),author:DB.getSession().username};
  
  container.innerHTML=`
    <form id="postForm"><div class="form-grid">
      <div class="form-main">
        <div class="wp-card"><div class="wp-card-body">
          <div class="form-row"><input type="text" class="form-input title-input" id="postTitle" placeholder="Add title" value="${escapeHtml(data.title)}" required></div>
          <div class="form-row" style="margin-top:12px"><div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--wp-gray-50)"><span>Permalink:</span><span style="color:var(--wp-blue)">#/post/</span><input type="text" id="postSlug" value="${escapeHtml(data.slug)}" style="border:none;border-bottom:1px dashed #ccc;padding:2px 4px;font-size:13px;width:200px;background:transparent"></div></div>
        </div></div>
        <div class="wp-card"><div class="wp-card-body" style="padding:0"><div class="editor-wrap">
          <div class="editor-toolbar">
            <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
            <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
            <button type="button" data-cmd="underline" title="Underline"><u>U</u></button><span class="sep"></span>
            <button type="button" data-cmd="formatBlock" data-val="h2" title="Heading 2">H2</button>
            <button type="button" data-cmd="formatBlock" data-val="h3" title="Heading 3">H3</button>
            <button type="button" data-cmd="formatBlock" data-val="p" title="Paragraph">P</button><span class="sep"></span>
            <button type="button" data-cmd="insertUnorderedList" title="Bullet list">• List</button>
            <button type="button" data-cmd="insertOrderedList" title="Numbered">1.</button><span class="sep"></span>
            <button type="button" data-cmd="createLink" title="Link">🔗</button>
            <button type="button" data-cmd="insertImage" title="Image">🖼️</button>
            <button type="button" data-cmd="formatBlock" data-val="blockquote" title="Quote">❝</button>
          </div>
          <div class="editor-content" id="postContent" contenteditable="true" data-placeholder="Start writing...">${data.content}</div>
        </div></div></div>
        <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">Excerpt</h2></div><div class="wp-card-body"><textarea class="form-textarea" id="postExcerpt" placeholder="Write a short summary...">${escapeHtml(data.excerpt)}</textarea><div class="form-hint">Appears on homepage and search results.</div></div></div>
      </div>
      <div class="form-side">
        <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">Publish</h2></div><div class="wp-card-body">
          <div class="form-row"><label class="form-label">Status</label><select class="form-select" id="postStatus"><option value="draft" ${data.status==='draft'?'selected':''}>Draft</option><option value="published" ${data.status==='published'?'selected':''}>Published</option></select></div>
          <div class="form-row"><label class="form-label">Publish date</label><input type="datetime-local" class="form-input" id="postDate" value="${new Date(data.date).toISOString().slice(0,16)}"></div>
          <div style="display:flex;gap:8px;margin-top:16px"><button type="submit" class="btn btn-primary" style="flex:1">${isEdit?'Update':'Publish'}</button><a href="#/admin/posts" class="btn btn-secondary">Cancel</a></div>
        </div></div>
        <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">Featured Image</h2></div><div class="wp-card-body"><input type="url" class="form-input" id="postImage" placeholder="https://..." value="${escapeHtml(data.featuredImage)}"><div id="imgPreview" style="margin-top:10px;${data.featuredImage?'':'display:none'}"><img src="${escapeHtml(data.featuredImage)}" alt="" style="width:100%;border-radius:4px;aspect-ratio:16/9;object-fit:cover"></div></div></div>
        <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">Categories & Tags</h2></div><div class="wp-card-body"><div class="form-row"><label class="form-label">Category</label><input type="text" class="form-input" id="postCategory" value="${escapeHtml(data.category)}" list="cats"><datalist id="cats"><option>News</option><option>Tutorial</option><option>Opinion</option><option>Uncategorized</option></datalist></div><div class="form-row"><label class="form-label">Tags (comma separated)</label><input type="text" class="form-input" id="postTags" value="${escapeHtml((data.tags||[]).join(', '))}" placeholder="web, design"></div></div></div>
      </div>
    </div></form>
  `;
  
  const titleEl=document.getElementById('postTitle'),slugEl=document.getElementById('postSlug'),contentEl=document.getElementById('postContent'),imgEl=document.getElementById('postImage'),imgPrev=document.getElementById('imgPreview');
  let slugEdited=!!data.slug;slugEl.addEventListener('input',()=>slugEdited=true);titleEl.addEventListener('input',()=>{if(!slugEdited)slugEl.value=slugify(titleEl.value)});
  imgEl.addEventListener('input',()=>{if(imgEl.value){imgPrev.style.display='block';imgPrev.querySelector('img').src=imgEl.value}else imgPrev.style.display='none'});
  
  container.querySelectorAll('[data-cmd]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const cmd=btn.dataset.cmd,val=btn.dataset.val;contentEl.focus();
      if(cmd==='createLink'){const url=prompt('Enter URL:','https://');if(url)document.execCommand('createLink',false,url)}
      else if(cmd==='insertImage'){const url=prompt('Image URL:','https://');if(url)document.execCommand('insertImage',false,url)}
      else{document.execCommand(cmd,false,val&&cmd==='formatBlock'?`<${val}>`:val)}
    })
  });
  
  document.getElementById('postForm').addEventListener('submit',e=>{
    e.preventDefault();
    const updated={...data,title:titleEl.value.trim(),slug:slugEl.value.trim()||slugify(titleEl.value),content:contentEl.innerHTML,excerpt:document.getElementById('postExcerpt').value.trim()||contentEl.innerText.substring(0,160),featuredImage:imgEl.value.trim(),category:document.getElementById('postCategory').value.trim()||'Uncategorized',tags:document.getElementById('postTags').value.split(',').map(t=>t.trim()).filter(Boolean),status:document.getElementById('postStatus').value,date:new Date(document.getElementById('postDate').value).toISOString()};
    if(isEdit){const idx=posts.findIndex(p=>p.id===id);posts[idx]=updated}else{posts.unshift(updated)}
    DB.savePosts(posts);location.hash='#/admin/posts';
  });
}

function renderMedia(container,posts){
  const images=posts.filter(p=>p.featuredImage).map(p=>p.featuredImage);const unique=[...new Set(images)];
  container.innerHTML=`<div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">Media Library</h2></div><div class="wp-card-body">${unique.length?`<div class="media-grid">${unique.map(src=>`<div class="media-item"><img src="${escapeHtml(src)}" loading="lazy"></div>`).join('')}</div>`:`<div class="empty-state"><h3>No media yet</h3><p>Add featured images to your posts.</p></div>`}<div class="wp-notice" style="margin-top:20px;border-left-color:#dba617">Media is stored as URLs. Upload support requires a backend.</div></div></div>`;
}

function renderSettings(container){
  const s=DB.getSettings();
  container.innerHTML=`
    <form id="settingsForm" style="max-width:720px">
      <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">General Settings</h2></div><div class="wp-card-body"><div class="form-row"><label class="form-label">Site Title</label><input type="text" class="form-input" id="setTitle" value="${escapeHtml(s.siteTitle)}" required></div><div class="form-row"><label class="form-label">Tagline</label><input type="text" class="form-input" id="setTagline" value="${escapeHtml(s.tagline)}"><div class="form-hint">In a few words, explain what this site is about.</div></div></div></div>
      <div class="wp-card"><div class="wp-card-header"><h2 class="wp-card-title">Admin Account</h2></div><div class="wp-card-body"><div class="form-row"><label class="form-label">Username</label><input type="text" class="form-input" id="setUser" value="${escapeHtml(s.username)}" required></div><div class="form-row"><label class="form-label">New Password</label><input type="password" class="form-input" id="setPass" placeholder="Leave blank to keep current"><div class="form-hint">Stored with base64 for demo purposes only.</div></div></div></div>
      <div style="display:flex;gap:10px"><button type="submit" class="btn btn-primary">Save Settings</button><button type="button" class="btn btn-danger" id="resetData">Reset Demo Data</button></div>
    </form>
  `;
  document.getElementById('settingsForm').addEventListener('submit',e=>{e.preventDefault();const updated={...s,siteTitle:document.getElementById('setTitle').value.trim(),tagline:document.getElementById('setTagline').value.trim(),username:document.getElementById('setUser').value.trim()};const np=document.getElementById('setPass').value;if(np)updated.passwordHash=btoa(np);DB.saveSettings(updated);const sess=DB.getSession();if(sess){sess.username=updated.username;DB.setSession(sess)}alert('Settings saved!');location.hash='#/admin/settings'});
  document.getElementById('resetData').addEventListener('click',()=>{if(confirm('Reset all posts and settings to demo defaults? This cannot be undone.')){localStorage.removeItem(DB.POSTS);localStorage.removeItem(DB.SETTINGS);localStorage.removeItem(DB.SESSION);location.hash='#/login';location.reload()}});
}

window.addEventListener('DOMContentLoaded',router);
window.addEventListener('hashchange',router);
</script>
</body>
</html>
